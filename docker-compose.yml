version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/clips:/app/clips
      - ./data/db:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/clipforge.db
      - UPLOAD_DIR=/app/uploads
      - CLIPS_DIR=/app/clips
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
