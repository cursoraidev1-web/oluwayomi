<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Clipper & Poster</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { text-align: center; margin-top: 50px; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin-bottom: 20px; color: #2c3e50; }
        p { margin-bottom: 30px; color: #666; }
        .input-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        input[type="text"] { width: 60%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        button { padding: 12px 24px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        #status { margin-top: 20px; font-weight: 500; min-height: 24px; }
        .log-box { margin-top: 30px; text-align: left; background: #222; color: #0f0; padding: 15px; border-radius: 4px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Auto Video Clipper</h1>
        <p>Enter a YouTube URL to automatically find highlights, clip them, and post to social media.</p>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
            <button id="processBtn" onclick="startProcessing()">Process Video</button>
        </div>
        
        <div id="status"></div>
        <div id="logBox" class="log-box"></div>
    </div>

    <script>
        async function startProcessing() {
            const url = document.getElementById('urlInput').value;
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('processBtn');
            const logBox = document.getElementById('logBox');
            
            if (!url) {
                statusDiv.innerText = "Please enter a URL";
                statusDiv.style.color = "red";
                return;
            }

            // Reset UI
            statusDiv.innerText = "Starting processing job...";
            statusDiv.style.color = "#333";
            btn.disabled = true;
            logBox.style.display = 'block';
            logBox.innerHTML = "> Job initiated...\n";

            try {
                const formData = new FormData();
                formData.append('url', url);
                
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    statusDiv.innerText = "Processing started in background! Check server logs for details.";
                    logBox.innerHTML += "> Server accepted request.\n> Downloading video...\n> (Check server console for real-time progress)";
                } else {
                    statusDiv.innerText = "Error: " + (data.error || "Unknown error");
                    statusDiv.style.color = "red";
                    btn.disabled = false;
                }
            } catch (e) {
                statusDiv.innerText = "Network Error: " + e.message;
                statusDiv.style.color = "red";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
